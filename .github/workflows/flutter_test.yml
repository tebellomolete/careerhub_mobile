# Assignment 3.2, Part 8.3 — CI for the unit and widget test
# pyramid.
#
# What this workflow does NOT do: run the Patrol integration test.
# Patrol requires a connected device (an emulator on a device-farm
# runner, or a physical device), which is a separate workflow's
# responsibility. This workflow covers the two lower layers of the
# pyramid — the layers `flutter test --coverage` can exercise on
# a plain Linux runner.
name: Flutter test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The project's `pubspec.yaml` targets Flutter's stable channel
      # against the SDK described by `sdk: ^3.12.0`. Pinning the
      # Flutter version to 3.44.5 matches the local dev environment;
      # bumping the pin should be a deliberate PR.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      # `flutter pub get` restores dependencies from pubspec.lock,
      # so CI resolves the exact package graph the local dev
      # environment used.
      - name: Install dependencies
        run: flutter pub get

      # `flutter analyze` DEFAULTS to `--fatal-infos --fatal-warnings`
      # — an empirically-verified surprise. `flutter analyze --help`
      # shows both flags as `--[no-]fatal-...` with no default listed,
      # and a plain `flutter analyze` still exits 1 when only info-
      # or warning-level lints are present (`22 issues found` on our
      # workspace returns exit code 1 even without either flag). To
      # actually get errors-only behaviour we must pass BOTH
      # `--no-fatal-infos` and `--no-fatal-warnings` explicitly.
      #
      # The codebase carries 22 pre-existing infos and warnings from
      # earlier assignments (isar_generator's `experimental_member_use`
      # on the emitted `.g.dart` files, `prefer_initializing_formals`
      # on the older repositories, `unintended_html_in_doc_comment`
      # on a few docstrings). None of these are from Assignment 3.2,
      # and repairing them is out of scope for this workflow. The
      # brief specifies "fail the workflow if any errors are
      # reported" — errors only.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # `flutter test test/unit test/widget --coverage` runs the
      # Assignment 3.2 suite (three-layer test pyramid: unit +
      # widget layers) and writes an lcov trace to
      # `coverage/lcov.info`. Two files are deliberately excluded:
      #   - `test/widget_test.dart` — a stale Assignment 2.1 file
      #     flagged as not-repaired at the start of Assignment 3.2
      #     (see README 3.2 preamble). It contains two tests that
      #     break against the current Assignment 3.1 code; the
      #     three-layer pyramid built for 3.2 supersedes it.
      #   - `integration_test/` — the Patrol test, which requires a
      #     connected device and runs in a separate device-farm
      #     workflow.
      - name: Run 3.2 unit and widget tests with coverage
        run: flutter test test/unit test/widget --coverage

      # The lcov artifact is uploaded for downstream jobs (or human
      # inspection) even when tests fail — the coverage delta is
      # often the most useful signal on a broken PR.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
